# Copy this file into a downstream repository as `.github/workflows/release.yml`.
# `scripts/sync.sh` does that automatically when the file does not exist yet.
name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write # create the tag and the GitHub release
  issues: write # comment on released issues
  pull-requests: write # comment on released pull requests

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  # Versioning: commit prefixes -> tag -> GitHub release. Language-agnostic.
  release:
    # Pin to a moving major tag (`@v1`), or to a commit SHA for maximum safety.
    uses: yang-dong-yd/repo-template/.github/workflows/release.yml@v1

  # Publishing: language-specific. Delete this whole job when the repository
  # publishes nothing. `needs.release.outputs.new_tag` is empty when the merge
  # contained no feat/fix, so this job is skipped and nothing is republished.
  publish:
    needs: release
    if: needs.release.outputs.new_tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # npm provenance and other OIDC-based registries
    env:
      VERSION: ${{ needs.release.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- npm
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     registry-url: https://registry.npmjs.org
      # - run: |
      #     npm ci
      #     npm version "${VERSION#v}" --no-git-tag-version
      #     npm publish --provenance
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #
      # ------------------------------------------------------------- Python
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      # - run: |
      #     python -m pip install build twine
      #     sed -i "s/^version = .*/version = \"${VERSION#v}\"/" pyproject.toml
      #     python -m build
      #     twine upload dist/*
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      #
      # --------------------------------------------------------------- Rust
      # - run: |
      #     cargo install cargo-edit
      #     cargo set-version "${VERSION#v}"
      #     cargo publish
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #
      # ------------------------------------------------- Docker / anything else
      # - run: |
      #     docker build -t ghcr.io/${{ github.repository }}:"${VERSION#v}" .
      #     docker push ghcr.io/${{ github.repository }}:"${VERSION#v}"
      #
      # Nothing to build or publish yet: fail loudly rather than silently
      # reporting a green release that shipped nothing.
      - name: No publish step configured yet
        run: |
          echo "::error::this repository released ${VERSION} but has no publish step; add one or delete the job"
          exit 1
