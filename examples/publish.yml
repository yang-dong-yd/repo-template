# A job fragment, not a workflow. Paste it into the `jobs:` map of the repository's
# `.github/workflows/release.yml`, next to the `release` job, when the repository
# publishes to a package registry (npm, PyPI, crates.io, a container registry...).
# Repositories that publish nothing simply omit it.
#
# `needs.release.outputs.new_tag` is empty when the merge contained no feat/fix, so
# this job is skipped and nothing is republished.

  publish:
    needs: release
    if: needs.release.outputs.new_tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # npm provenance and other OIDC-based registries
    env:
      VERSION: ${{ needs.release.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

