      #     docker build -t ghcr.io/${{ github.repository }}:"${VERSION#v}" .
      #     docker push ghcr.io/${{ github.repository }}:"${VERSION#v}"

      # Until this is replaced the job fails on purpose: a release that reports
      # success while shipping nothing is worse than a red run.
      - name: No publish step configured yet
        run: |
          echo "::error::this repository released ${VERSION} but has no publish step; add one or delete the job"
          exit 1
