name: Release

# Reusable release workflow. Downstream repositories call this instead of copying
# the release logic, so a fix here reaches every repository at once.
#
# Caller (see examples/caller-release.yml):
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#         issues: write
#         pull-requests: write
#       uses: <owner>/repo-template/.github/workflows/release.yml@v1
#       secrets:
#         NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false # only repositories that publish to npm define this

permissions:
  contents: write # create the tag and the GitHub release
  issues: write # comment on released issues
  pull-requests: write # comment on released pull requests

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history and every tag
          persist-credentials: false # semantic-release authenticates with GITHUB_TOKEN

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # semantic-release 25 requires ^22.14.0 || >=24.10.0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --yes semantic-release@25
